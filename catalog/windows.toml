# ───────────────────────────────── Games ─────────────────────────────────

[[item]]
id = "shader-caches"
name = "Graphics shader caches"
category = "Games"
tier = "safe"
paths = [
  '%LOCALAPPDATA%\NVIDIA\DXCache', '%LOCALAPPDATA%\NVIDIA\GLCache', '%LOCALAPPDATA%\D3DSCache',
  '%LOCALAPPDATA%\AMD\DxCache', '%LOCALAPPDATA%\AMD\DxcCache', '%LOCALAPPDATA%\AMD\VkCache',
]
what = "Pre-compiled graphics code your GPU driver saves for games."
after = "Games may stutter briefly the first time while it rebuilds."
action = "contents"

[[item]]
id = "steam-shadercache"
name = "Steam shader cache"
category = "Games"
tier = "ask"
paths = ['{steam}\steamapps\shadercache']
what = "Pre-compiled shaders Steam keeps for each game."
after = "Steam rebuilds them; games can stutter at first."
action = "contents"

[[item]]
id = "steam-background-recordings"
name = "Steam background recordings"
category = "Videos"
tier = "ask"
paths = ['{videos}\Steam\video']
what = "Gameplay Steam records in the background so you can save clips later."
after = "Older moments can't be turned into clips anymore. Clips you already saved are kept."
action = "recycle"

[[item]]
id = "steam-clips"
name = "Saved Steam clips"
category = "Videos"
tier = "ask"
paths = ['{videos}\Steam\clips']
what = "Clips you saved from Steam game recording."
after = "They go to the Recycle Bin, so you can still change your mind."
action = "recycle"

# ──────────────────────────────── Windows ────────────────────────────────

[[item]]
id = "temp-files"
name = "Temporary files"
category = "Windows"
tier = "safe"
paths = ['%TEMP%']
what = "Leftovers from installers and apps. Anything changed in the last 2 days is kept."
after = "Nothing visible. Files in use are skipped."
action = "contents"
min_age_days = 2

[[item]]
id = "crash-dumps"
name = "Crash dumps and error reports"
category = "Windows"
tier = "safe"
paths = ['%LOCALAPPDATA%\CrashDumps', '%LOCALAPPDATA%\Microsoft\Windows\WER']
what = "Memory snapshots and reports saved when apps crashed."
after = "Nothing visible."
action = "contents"
min_mb = 20

[[item]]
id = "windows-update-leftovers"
name = "Windows Update leftovers"
category = "Windows"
tier = "manual"
paths = ['%WINDIR%\SoftwareDistribution\Download']
what = "Update files Windows already installed."
how = "Open Disk Cleanup → Clean up system files → tick Windows Update Cleanup. Needs admin rights."
open = "run:cleanmgr"
action = "manual"
min_mb = 500

[[item]]
id = "windows-old"
name = "Previous Windows installation"
category = "Windows"
tier = "manual"
paths = ['%SystemDrive%\Windows.old']
what = "A backup of your old Windows from the last big upgrade. You only need it to roll back."
how = "Settings → System → Storage → Temporary files → tick Previous Windows installation(s)."
open = "ms-settings:storagesense"
action = "manual"
min_mb = 1000

[[item]]
id = "hibernation-file"
name = "Hibernation file"
category = "Windows"
tier = "manual"
paths = ['%SystemDrive%\hiberfil.sys']
what = "Where Windows saves memory when the PC hibernates. Fast Startup uses it too."
how = "If you never hibernate, open Terminal as admin and run powercfg /h off. You lose Hibernate and Fast Startup."
action = "manual"
min_mb = 2000
