[[item]]
id = "torch-hub"
name = "PyTorch model cache"
category = "AI models"
tier = "ask"
paths = ['{home}\.cache\torch']
what = "Model weights downloaded by PyTorch."
after = "Downloaded again when a script needs them."
action = "delete"

[[item]]
id = "ollama-models"
name = "Ollama models"
category = "AI models"
tier = "manual"
paths = ['{home}\.ollama\models']
what = "Local AI models you've pulled with Ollama."
how = "Run ollama list, then ollama rm <name> for models you don't use."
action = "manual"
