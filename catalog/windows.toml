[[item]]
id = "chrome-ai-model"
name = "Chrome's built-in AI model"
category = "AI models"
tier = "manual"
paths = [
  '%LOCALAPPDATA%\Google\Chrome\User Data\OptGuideOnDeviceModel',
  '%LOCALAPPDATA%\Google\Chrome Beta\User Data\OptGuideOnDeviceModel',
  '%LOCALAPPDATA%\Google\Chrome Dev\User Data\OptGuideOnDeviceModel',
  '%LOCALAPPDATA%\Google\Chrome SxS\User Data\OptGuideOnDeviceModel',
]
what = "Gemini Nano, used by Chrome features like Help me write. Each copy of Chrome downloads its own (about 4 GB)."
how = "If you don't use those features: open chrome://flags/#optimization-guide-on-device-model in each Chrome, set it to Disabled and relaunch. Deleting the folder alone doesn't help, because Chrome downloads it again."
action = "manual"
min_mb = 500

# ──────────────────────────── Browsers and apps ────────────────────────────

[[item]]
id = "browser-caches"
name = "Browser caches"
category = "Browsers & apps"
tier = "safe"
paths = [
  '%LOCALAPPDATA%\Google\Chrome\User Data\*\Cache', '%LOCALAPPDATA%\Google\Chrome\User Data\*\Code Cache', '%LOCALAPPDATA%\Google\Chrome\User Data\*\GPUCache',
  '%LOCALAPPDATA%\Google\Chrome Beta\User Data\*\Cache', '%LOCALAPPDATA%\Google\Chrome Beta\User Data\*\Code Cache',
  '%LOCALAPPDATA%\Microsoft\Edge\User Data\*\Cache', '%LOCALAPPDATA%\Microsoft\Edge\User Data\*\Code Cache', '%LOCALAPPDATA%\Microsoft\Edge\User Data\*\GPUCache',
  '%LOCALAPPDATA%\BraveSoftware\Brave-Browser\User Data\*\Cache', '%LOCALAPPDATA%\BraveSoftware\Brave-Browser\User Data\*\Code Cache',
  '%LOCALAPPDATA%\Mozilla\Firefox\Profiles\*\cache2',
]
what = "Copies of websites your browsers keep to load pages faster. Logins, history and bookmarks are not touched."
after = "Sites load a little slower the first time. Close your browsers first so nothing is skipped."
action = "contents"

[[item]]
id = "discord-cache"
