# DiskBreeze catalog for Windows
#
# Each [[item]] teaches DiskBreeze about one thing that fills up disks.
# Adding an entry here is the easiest way to contribute. No Rust needed.
#
# paths   %ENV% variables, {home} {downloads} {videos} {pictures} {steam},
#         and * or ? wildcards inside a single folder name.
# tier    safe   = rebuilds itself; pre-selected
#         ask    = the user's own stuff or a big re-download; never pre-selected
#         manual = we explain, the user does it (admin rights, another app)
# action  delete   = remove the folders
#         contents = empty the folders, keep the folders themselves
#         recycle  = move to the Recycle Bin (anything personal)
#         command  = run the tool's own clean command; `fallback` if it fails
#         manual   = nothing automatic; `how` explains, `open` links somewhere
# min_mb  hide the entry when it's smaller than this (default 50)
#
# Rule of thumb: if you aren't sure something regenerates, it's `ask`, not `safe`.

# ───────────────────────────── Developer caches ─────────────────────────────

[[item]]
id = "npm-cache"
name = "npm cache"
category = "Developer caches"
tier = "safe"
paths = ['%LOCALAPPDATA%\npm-cache']
what = "A copy of every npm package you've ever installed."
after = "The next npm install downloads packages again."
action = "command"
command = "npm cache clean --force"
fallback = "contents"

[[item]]
id = "pnpm-store"
name = "pnpm store"
category = "Developer caches"
tier = "safe"
paths = ['%LOCALAPPDATA%\pnpm\store']
what = "pnpm's shared package store."
after = "Only packages no project uses anymore are removed, so this can free less than shown. Clean old project builds at the same time to free more."
action = "command"
command = "pnpm store prune"

[[item]]
id = "yarn-cache"
