name = "Hugging Face models"
category = "AI models"
tier = "ask"
paths = ['{home}\.cache\huggingface\hub']
what = "AI models downloaded by Python scripts (transformers, diffusers…)."
after = "Each model downloads again the next time a script loads it. Big ones take a while."
