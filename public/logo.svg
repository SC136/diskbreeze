<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="DiskBreeze">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2bb3a6"/>
      <stop offset="1" stop-color="#0f5d57"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="232" fill="url(#shine)"/>
  <!-- disk-usage ring: track + used arc -->
  <circle cx="512" cy="512" r="292" fill="none" stroke="#fff" stroke-opacity=".24" stroke-width="112"/>
  <circle cx="512" cy="512" r="292" fill="none" stroke="#fff" stroke-width="112" stroke-linecap="round"
          stroke-dasharray="1320 1835" transform="rotate(-90 512 512)"/>
  <!-- Breeze mark from PR #1, sized to fit inside the original gauge. -->
  <g transform="translate(512 512) scale(.72) translate(-509 -466)"
     fill="none" stroke="#fff" stroke-width="66" stroke-linecap="round" stroke-linejoin="round">
    <path d="M350 410 H590 C632 410 662 380 662 342 C662 304 630 274 592 274 C554 274 530 304 530 338"/>
    <path d="M264 512 H676 C720 512 754 544 754 586 C754 628 720 658 678 658 C640 658 614 632 614 598"/>
    <path d="M374 614 H526"/>
  </g>
</svg>
