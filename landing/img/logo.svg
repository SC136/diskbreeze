<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="DiskBreeze">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2bb3a6"/>
      <stop offset="1" stop-color="#0f5d57"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="232" fill="url(#shine)"/>
  <!-- disk-usage ring: track + used arc -->
  <circle cx="512" cy="512" r="292" fill="none" stroke="#fff" stroke-opacity=".24" stroke-width="112"/>
  <circle cx="512" cy="512" r="292" fill="none" stroke="#fff" stroke-width="112" stroke-linecap="round"
          stroke-dasharray="1320 1835" transform="rotate(-90 512 512)"/>
  <!-- medical cross -->
  <rect x="468" y="396" width="88" height="232" rx="26" fill="#fff"/>
  <rect x="396" y="468" width="232" height="88" rx="26" fill="#fff"/>
</svg>
